name: navigito
description: "Navigito mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management, navigation & DI
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  get_it: ^9.3.0

  # Networking & storage
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Utilities
  equatable: ^3.0.0
  fpdart: ^1.2.0
  intl: ^0.20.3
  logger: ^2.8.0
  google_maps_flutter: ^2.18.1
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.17.0
  geolocator: ^14.0.1
  supabase_flutter: ^2.18.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  dynamic_color: ^1.1.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
